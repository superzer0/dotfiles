name: Validate dotfiles

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dotfiles-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chezmoi:
    name: chezmoi (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install chezmoi
        if: runner.os != 'Windows'
        shell: bash
        run: |
          sh -c "$(curl -fsLS https://get.chezmoi.io)" -- -b "$HOME/.local/bin" -t v2.72.0
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install chezmoi
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bin = Join-Path $env:USERPROFILE 'bin'
          Invoke-Expression "&{$(Invoke-RestMethod 'https://get.chezmoi.io/ps1')} -b '$bin' -t 'v2.72.0'"
          $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Validate rendered source state
        shell: pwsh
        run: ./tests/validate-chezmoi.ps1
